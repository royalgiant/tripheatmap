# City Data Import Jobs
# Cron format: minute hour day month day_of_week
# Examples: '0 2 * * *' = daily at 2 AM, '0 2 * * 0' = Sunday at 2 AM

# Update places data for all cities weekly (Sunday at 2 AM)
# Places data changes as restaurants/cafes/bars open or close
update_all_places_weekly:
  cron: '0 2 * * 0'
  class: UpdatePlacesJob
  description: 'Update places/amenity data for all cities weekly'
  queue: default

# Fetch Wikipedia images for neighborhoods (every 3 days at 3 AM)
# Processes 100 neighborhoods per run to avoid overwhelming Wikipedia API
# Images are cached for 30 days before refetching
fetch_wikipedia_images:
  cron:  '0 3 15 * *'
  class: FetchWikipediaImagesJob
  description: 'Fetch and cache Wikipedia images for neighborhood pages'
  queue: default

refresh_sitemap_monthly:
  cron: '0 23 1 * *'
  class: RefreshSitemapWorker
  description: 'Regenerate sitemap.xml with latest pages'
  queue: default

# Update hotels/hostels for all cities monthly (26th at 2 AM)
# Removes hotels that went out of business and adds new ones
# This ensures our hotel data stays fresh and accurate
update_hotels_monthly:
  cron: '0 2 24 * *'
  class: UpdateHotelsJob
  description: 'Update hotels/hostels for all cities, remove closed businesses, add new ones'
  queue: default

# Lead Generation Marketplace Jobs
# Daily digest of new leads for hosts and new offers for guests
daily_lead_offer_digest:
  cron: '0 21 * * *'
  class: DailyLeadAndOfferDigestJob
  description: 'Notify hosts of new matching searches and guests of new offers (runs 9 PM daily)'
  queue: default

# Weekly digest of new leads for hosts and new offers for guests
weekly_lead_offer_digest:
  cron: '0 21 * * 0'
  class: WeeklyLeadAndOfferDigestJob
  description: 'Notify hosts of new matching searches and guests of new offers from past week (runs 9 PM Sundays)'
  queue: default

# Expire old offers that have passed their expiration date
expire_offers_hourly:
  cron: '0 * * * *'
  class: ExpireOffersJob
  description: 'Mark offers past expiration date as expired (runs hourly)'
  queue: default
